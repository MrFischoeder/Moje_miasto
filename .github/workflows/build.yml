# Po każdym pushu: testy i wersja jednoplikowa gry do pobrania (zakładka Actions -> przebieg -> Artifacts).
name: Build

on:
  push:
    branches-ignore: [serwer]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:single
      # krok niekrytyczny: przy wyczerpanym limicie miejsca na artefakty build i tak przechodzi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: moje-miasto
          path: dist-single/moje-miasto.html
          retention-days: 7

  # Po udanych testach: gotowa wersja przeglądarkowa (cała Warszawa) na gałęzi "serwer" (jeden commit, nadpisywany).
  # Serwer co 2 minuty pobiera ją sam (tools/serwer-instalacja.sh), więc nie są potrzebne żadne klucze ani hasła.
  publish:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Gałąź "serwer"
        run: |
          set -e
          rm -rf client/dist/tiles-pelne
          cd client/dist
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA} $(date -u +%FT%TZ)" > wersja.txt
          git init -q -b serwer && git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Gra: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" serwer
