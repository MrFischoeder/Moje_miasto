# Po każdym pushu: testy i wersja jednoplikowa gry do pobrania (zakładka Actions -> przebieg -> Artifacts).
name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:single
      # krok niekrytyczny: przy wyczerpanym limicie miejsca na artefakty build i tak przechodzi
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: moje-miasto
          path: dist-single/moje-miasto.html
          retention-days: 7
